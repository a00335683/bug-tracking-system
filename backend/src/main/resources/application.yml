spring:
  application:
    name: bug-tracker

  datasource:
    url: jdbc:mysql://localhost:3306/bugtracker
    username: root
    password: Root1234.

  jpa:
    hibernate:
      ddl-auto: update
    defer-datasource-initialization: true
    show-sql: true

  sql:
    init:
      mode: always

server:
  port: 8081
  error:
    include-stacktrace: always
    include-exception: true
