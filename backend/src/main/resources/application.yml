spring:
  application:
    name: bug-tracker
  profiles:
      active: dev

  datasource:
    url: jdbc:mysql://localhost:3306/bugtracker
    username: root
    password: Root1234.

  jpa:
    hibernate:
      ddl-auto: create
    defer-datasource-initialization: true
    show-sql: true

  sql:
    init:
      mode: always

server:
  port: 8081
  error:
    include-stacktrace: always
    include-exception: true

app:
    seed:
      admin-password: admin123
      tester-password: tester123
      developer-password: dev123

jwt:
  secret: secretkey


