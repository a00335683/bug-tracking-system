<div class="row justify-content-center align-items-center" style="min-height: 80vh;">
    <div class="col-md-5">

        <div class="card shadow-lg border-0" style="border-radius: 18px; background: linear-gradient(135deg, #ffffff, #fdf2f8);">
            <div class="card-body p-4">

                <h3 class="text-center mb-4 fw-bold" style="color:#6f2d5c;">
                    Login
                </h3>

                <div id="errorMessage" class="alert alert-danger d-none"></div>

                <form id="loginForm">

                    <div class="mb-3">
                        <label for="username" class="form-label" style="color:#6f2d5c;">Username</label>
                        <input type="text" id="username" class="form-control" required
                               style="border-radius: 10px; border: 1px solid #e9d5ff;">
                    </div>

                    <div class="mb-3">
                        <label for="password" class="form-label" style="color:#6f2d5c;">Password</label>
                        <input type="password" id="password" class="form-control" required
                               style="border-radius: 10px; border: 1px solid #fbcfe8;">
                    </div>

                    <button type="submit" class="btn w-100"
                            style="background: linear-gradient(90deg, #6f2d5c, #be185d); color: white; border: none; border-radius: 10px;">
                        Login
                    </button>

                </form>

            </div>
        </div>

    </div>
</div>
