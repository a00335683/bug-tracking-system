<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bug Tracker - Issues</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.8/css/jquery.dataTables.min.css">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-dark">
    <div class="container-fluid">
        <span class="navbar-brand mb-0 h1">Bug Tracking System</span>
        <div>
            <a href="dashboard.html" class="btn btn-outline-light me-2">Dashboard</a>
            <button class="btn btn-outline-light" onclick="logout()">Logout</button>
        </div>
    </div>
</nav>

<div class="container mt-5">
    <h3 class="text-primary mb-4">Issues</h3>

    <div class="card shadow-sm border-0">
        <div class="card-body">
            <h5 class="card-title mb-3">All Issues</h5>

            <div class="row g-3 mb-4">
                <div class="col-md-3">
                    <input type="number" class="form-control" id="filterProjectId" placeholder="Project ID">
                </div>

                <div class="col-md-3">
                    <select class="form-select" id="filterStatus">
                        <option value="">Status</option>
                        <option value="OPEN">OPEN</option>
                        <option value="IN_PROGRESS">IN_PROGRESS</option>
                        <option value="RESOLVED">RESOLVED</option>
                        <option value="VERIFIED">VERIFIED</option>
                        <option value="CLOSED">CLOSED</option>
                    </select>
                </div>

                <div class="col-md-3">
                    <select class="form-select" id="filterPriority">
                        <option value="">Priority</option>
                        <option value="LOW">LOW</option>
                        <option value="MEDIUM">MEDIUM</option>
                        <option value="HIGH">HIGH</option>
                    </select>
                </div>

                <div class="col-md-3 d-grid">
                    <button class="btn btn-primary" id="filterBtn">Apply Filter</button>
                </div>
            </div>

            <button id="createIssueBtn" class="btn btn-primary mb-3" data-bs-toggle="modal" data-bs-target="#createIssueModal">
                Create Issue
            </button>

            <div id="issueMessage" class="alert alert-success d-none"></div>

            <div class="table-responsive">
                <table class="table table-bordered table-striped table-hover align-middle" id="issuesTable">
                    <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>Title</th>
                        <th>Status</th>
                        <th>Priority</th>
                        <th>Project ID</th>
                        <th>Assigned To</th>
                        <th id="assignHeader">Assign</th>
                        <th id="statusHeader">Update Status</th>
                    </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<!-- Create Issue Modal -->
<div class="modal fade" id="createIssueModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header bg-dark text-white">
                <h5 class="modal-title">Create Issue</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>

            <div class="modal-body">
                <form id="createIssueForm">
                    <div class="mb-3">
                        <label class="form-label">Project ID</label>
                        <input type="number" class="form-control" id="projectId" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Reporter ID</label>
                        <input type="number" class="form-control" id="reporterId" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Title</label>
                        <input type="text" class="form-control" id="issueTitle" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Description</label>
                        <textarea class="form-control" id="issueDescription" rows="3" required></textarea>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Priority</label>
                        <select class="form-select" id="issuePriority" required>
                            <option value="">Select Priority</option>
                            <option value="LOW">LOW</option>
                            <option value="MEDIUM">MEDIUM</option>
                            <option value="HIGH">HIGH</option>
                        </select>
                    </div>

                    <button type="submit" class="btn btn-primary">Save Issue</button>
                </form>
            </div>
        </div>
    </div>
</div>

<!-- Assign Issue Modal -->
<div class="modal fade" id="assignIssueModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header bg-dark text-white">
                <h5 class="modal-title">Assign Issue</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>

            <div class="modal-body">
                <form id="assignIssueForm">
                    <input type="hidden" id="assignIssueId">

                    <div class="mb-3">
                        <label class="form-label">Developer</label>
                        <select class="form-select" id="developerId" required></select>
                    </div>

                    <button type="submit" class="btn btn-primary">Assign Issue</button>
                </form>
            </div>
        </div>
    </div>
</div>

<!-- Update Status Modal -->
<div class="modal fade" id="updateStatusModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header bg-dark text-white">
                <h5 class="modal-title">Update Issue Status</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>

            <div class="modal-body">
                <form id="updateStatusForm">
                    <input type="hidden" id="statusIssueId">

                    <div class="mb-3">
                        <label class="form-label">New Status</label>
                        <select class="form-select" id="newStatus" required>
                            <option value="">Select Status</option>
                            <option value="IN_PROGRESS">IN_PROGRESS</option>
                            <option value="RESOLVED">RESOLVED</option>
                            <option value="VERIFIED">VERIFIED</option>
                            <option value="CLOSED">CLOSED</option>
                        </select>
                    </div>

                    <div class="mb-3 d-none" id="resolutionNoteGroup">
                        <label class="form-label">Resolution Note</label>
                        <textarea class="form-control" id="resolutionNote"></textarea>
                    </div>

                    <button type="submit" class="btn btn-primary">Update Status</button>
                </form>
            </div>
        </div>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.datatables.net/1.13.8/js/jquery.dataTables.min.js"></script>
<script src="../js/api.js"></script>
<script src="../js/issues.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
