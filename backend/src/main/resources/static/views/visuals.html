<h3 class="mb-4" style="color:#6f2d5c;">Visual Representation</h3>

<div class="d-flex justify-content-between align-items-center mb-4">
    <p class="mb-0 text-muted">Overview of issues by status and priority.</p>
    <button id="backToDashboardBtn" class="btn" style="background-color:#6f2d5c; color:white; border:none;">
        <i class="bi bi-arrow-left me-1"></i> Back to Dashboard
    </button>
</div>

<div class="row g-4">
    <div class="col-md-6">
        <div class="card shadow-sm border-0 h-100" style="background: linear-gradient(135deg, #f3e8ff, #fdf2f8); border-radius: 16px;">
            <div class="card-body">
                <h5 class="card-title mb-3" style="color:#6f2d5c;">
                    <i class="bi bi-pie-chart-fill me-2"></i>Issues by Status
                </h5>
                <canvas id="statusChart"></canvas>
            </div>
        </div>
    </div>

    <div class="col-md-6">
        <div class="card shadow-sm border-0 h-100" style="background: linear-gradient(135deg, #fdf2f8, #ffe4ec); border-radius: 16px;">
            <div class="card-body">
                <h5 class="card-title mb-3" style="color:#8b1e3f;">
                    <i class="bi bi-bar-chart-fill me-2"></i>Issues by Priority
                </h5>
                <canvas id="priorityChart"></canvas>
            </div>
        </div>
    </div>
</div>
