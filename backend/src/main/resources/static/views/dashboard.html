<h3 class="mb-4" style="color:#6f2d5c;">Dashboard</h3>

<div class="row g-4 mb-4">
    <div class="col-md-6">
        <div class="card shadow-sm border-0 text-center h-100" style="background: linear-gradient(135deg, #f3e8ff, #e9d5ff); border-radius: 16px;">
            <div class="card-body">
                <h5 class="card-title" style="color:#7c3aed;">
                    <i class="bi bi-folder-fill me-2"></i>Projects
                </h5>
                <h2 id="projectCount" style="color:#5b2167;">0</h2>
            </div>
        </div>
    </div>

    <div class="col-md-6">
        <div class="card shadow-sm border-0 text-center h-100" style="background: linear-gradient(135deg, #ffe4ec, #fbcfe8); border-radius: 16px;">
            <div class="card-body">
                <h5 class="card-title" style="color:#be185d;">
                    <i class="bi bi-bug-fill me-2"></i>Issues
                </h5>
                <h2 id="issueCount" style="color:#881337;">0</h2>
            </div>
        </div>
    </div>
</div>

<div class="card shadow-sm border-0" style="background: linear-gradient(135deg, #fdf2f8, #f3e8ff); border-radius: 16px;">
    <div class="card-body">
        <h5 class="card-title mb-3" style="color:#6f2d5c;">
            <i class="bi bi-link-45deg me-2"></i>Quick Links
        </h5>

        <div class="d-flex flex-wrap gap-2">
            <button id="goIssuesBtn" class="btn" style="background-color:#6f2d5c; color:white; border:none;">
                <i class="bi bi-list-ul me-1"></i> View Issues
            </button>

            <button id="showGraphBtn" class="btn" style="background-color:#8b1e3f; color:white; border:none;">
                <i class="bi bi-bar-chart-fill me-1"></i> Visual Representation
            </button>
        </div>
    </div>
</div>
