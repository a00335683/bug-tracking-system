<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bug Tracker</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.8/css/jquery.dataTables.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-dark">
    <div class="container-fluid">
        <span class="navbar-brand mb-0 h1">Bug Tracking System</span>

        <div>
            <button id="navDashboard" class="btn btn-outline-light me-2">
            <i class="bi bi-speedometer2"></i> Dashboard
            </button>

            <button id="navIssues" class="btn btn-outline-light me-2">
                <i class="bi bi-bug"></i> Issues
            </button>

            <button id="navProjects" class="btn btn-outline-light me-2">
                <i class="bi bi-folder"></i> Projects
            </button>

            <button class="btn btn-outline-light" onclick="logout()">
                <i class="bi bi-box-arrow-right"></i> Logout
            </button>
        </div>
    </div>
</nav>

<div class="container mt-5">
    <div id="app"></div>
</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.datatables.net/1.13.8/js/jquery.dataTables.min.js"></script>
<script src="js/api.js"></script>
<script src="js/dashboard.js"></script>
<script src="js/issues.js"></script>
<script src="js/projects.js"></script>
<script src="js/router.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
