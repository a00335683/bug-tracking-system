<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Bug Tracker - Issues</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- DataTables CSS -->
    <link href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-4">

    <!-- Header + Create Button -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>All Issues</h2>
        <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#createIssueModal">
            + Create Issue
        </button>
    </div>

    <!-- Issues Table -->
    <table id="issuesTable" class="table table-striped table-bordered">
        <thead>
        <tr>
            <th>ID</th>
            <th>Title</th>
            <th>Status</th>
            <th>Priority</th>
            <th>Created At</th>
        </tr>
        </thead>
        <tbody>
        </tbody>
    </table>

</div>

<!-- Create Issue Modal -->
<div class="modal fade" id="createIssueModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">

            <div class="modal-header">
                <h5 class="modal-title">Create Issue</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>

            <div class="modal-body">

                <div class="mb-3">
                    <label class="form-label">Title</label>
                    <input type="text" id="issueTitle" class="form-control">
                </div>

                <div class="mb-3">
                    <label class="form-label">Description</label>
                    <textarea id="issueDescription" class="form-control"></textarea>
                </div>

                <div class="mb-3">
                    <label class="form-label">Priority</label>
                    <select id="issuePriority" class="form-select">
                        <option value="LOW">LOW</option>
                        <option value="MEDIUM">MEDIUM</option>
                        <option value="HIGH">HIGH</option>
                    </select>
                </div>

            </div>

            <div class="modal-footer">
                <button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button class="btn btn-success" id="saveIssueBtn">Save</button>
            </div>

        </div>
    </div>
</div>

<!-- Scripts -->
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>

<script>

    const token = localStorage.getItem("token");

    if (!token) {
        window.location.href = "login.html";
    }

    $(document).ready(function () {

        // LOAD ISSUES
        $.ajax({
            url: "/api/issues",
            type: "GET",
            headers: {
                "Authorization": "Bearer " + token
            },
            success: function (issues) {

                issues.forEach(issue => {
                    $("#issuesTable tbody").append(`
                        <tr>
                            <td>${issue.id}</td>
                            <td>${issue.title}</td>
                            <td>${issue.status}</td>
                            <td>${issue.priority}</td>
                            <td>${issue.createdAt}</td>
                        </tr>
                    `);
                });

                $('#issuesTable').DataTable();
            },
            error: function () {
                alert("Failed to load issues.");
            }
        });

        // CREATE ISSUE
        $("#saveIssueBtn").click(function () {

            const title = $("#issueTitle").val();
            const description = $("#issueDescription").val();
            const priority = $("#issuePriority").val();

            $.ajax({
                url: "/api/issues",
                type: "POST",
                contentType: "application/json",
                headers: {
                    "Authorization": "Bearer " + token
                },
                data: JSON.stringify({
                    projectId: 1,
                    reporterId: 1,
                    title: title,
                    description: description,
                    priority: priority
                }),
                success: function () {
                    location.reload();
                },
                error: function () {
                    alert("Failed to create issue.");
                }
            });

        });

    });

</script>

</body>
</html>
