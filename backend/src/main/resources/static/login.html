<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bug Tracker - Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body style="background: linear-gradient(135deg, #fdf2f8, #f3e8ff); min-height: 100vh;">

<nav class="navbar navbar-dark" style="background: linear-gradient(90deg, #1f2937, #111827);">
    <div class="container-fluid">
        <span class="navbar-brand mb-0 h1 fw-bold">Bug Tracking System</span>
    </div>
</nav>

<div class="container">
    <div class="row justify-content-center align-items-center min-vh-100">
        <div class="col-md-5">

            <div class="card shadow-lg border-0" style="border-radius: 18px; background: linear-gradient(135deg, #ffffff, #fdf2f8);">
                <div class="card-body p-4">

                    <h3 class="text-center mb-4 fw-bold" style="color:#6f2d5c;">
                        Login
                    </h3>

                    <div id="errorMessage" class="alert alert-danger d-none"></div>

                    <form id="loginForm">

                        <div class="mb-3">
                            <label for="username" class="form-label" style="color:#6f2d5c;">Username</label>
                            <input type="text" id="username" class="form-control" required
                                   style="border-radius: 10px; border: 1px solid #e9d5ff;">
                        </div>

                        <div class="mb-3">
                            <label for="password" class="form-label" style="color:#6f2d5c;">Password</label>
                            <input type="password" id="password" class="form-control" required
                                   style="border-radius: 10px; border: 1px solid #fbcfe8;">
                        </div>

                        <button type="submit" class="btn w-100"
                                style="background: linear-gradient(90deg, #6f2d5c, #be185d); color: white; border: none; border-radius: 10px;">
                            Login
                        </button>

                    </form>

                </div>
            </div>

        </div>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="js/api.js"></script>
<script src="js/login.js"></script>

</body>
</html>
